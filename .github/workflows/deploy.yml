name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's default is 10 minutes, and it ABORTS a deployment that
          # is still reporting deployment_in_progress when it expires — so a
          # slow-but-healthy publish gets cancelled and nothing ships. That's
          # what happened to b141bf6: a 4 MB / 124-file artifact, well under any
          # limit, timed out four times in a row while GitHub was reporting all
          # systems operational. Waiting costs nothing when things are fast.
          timeout: 1800000        # 30 minutes
          error_count: 20         # tolerate more transient status-poll errors
