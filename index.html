    <!-- ── Link previews ─────────────────────────────────────────────────────
         Members reach this app almost entirely by tapping a link in the club
         WhatsApp group, and until now those links rendered as a bare URL with
         no title, no image and no clue what they were.

         These have to live in the served HTML: WhatsApp's crawler does not run
         JavaScript, so react-helmet and friends do nothing for it. That also
         means one preview for the whole site — GitHub Pages returns this same
         file for every route. A per-match card ("SCC v Out of Office XI") needs
         HTML rendered per match, which is a separate job.

         og:image must be absolute. A relative path is silently ignored and you
         get a card with no picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sangria Cricket Club" />
    <meta property="og:title" content="Sangria Cricket Club" />
    <meta property="og:description" content="Squad, availability, challenges and live scores for SCC. Sign in with your phone number." />

    <!-- ── Boot splash ───────────────────────────────────────────────────────
         The first thing a member saw on a cold open was a white screen while
         the bundle downloaded — the app looked slow before it had done
         anything. This paints the club crest immediately instead.

         The logo is inlined at 128px (~10KB). The full-size one in
         src/assets is 462KB, which would have delayed the very paint this
         exists to cover. No network request, so it shows on the first frame.

         It removes itself when React mounts, and gives up on its own after
         eight seconds so a failed bundle can never leave someone staring at
         a logo forever. -->
    <style>
      #scc-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;
        justify-content:center;flex-direction:column;gap:18px;
        background:linear-gradient(160deg,#065f46 0%,#064e3b 55%,#022c22 100%);
        transition:opacity .28s ease}
      #scc-splash.gone{opacity:0;pointer-events:none}
      #scc-splash img{width:88px;height:88px;border-radius:22px;object-fit:cover;
        box-shadow:0 12px 40px rgba(0,0,0,.35);animation:sccPulse 1.6s ease-in-out infinite}
      #scc-splash .n{color:#fff;font:800 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;
        letter-spacing:.14em;text-transform:uppercase;opacity:.92}
      #scc-splash .b{width:112px;height:3px;border-radius:99px;background:rgba(255,255,255,.18);
        overflow:hidden}
      #scc-splash .b i{display:block;width:40%;height:100%;border-radius:99px;
        background:#6ee7b7;animation:sccSlide 1.1s ease-in-out infinite}
      @keyframes sccPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes sccSlide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
      @media (prefers-reduced-motion:reduce){
        #scc-splash img,#scc-splash .b i{animation:none}
      }
    </style>
    <title>Sangria Cricket Club</title>
    <!-- Start Single Page Apps for GitHub Pages (web only, not used by native app) -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      if (!window.Capacitor) {
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location));
      }
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
